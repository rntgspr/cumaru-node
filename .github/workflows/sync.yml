name: Sync upstream release

on:
  repository_dispatch:
    types: [cumaru-release]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      created: ${{ steps.check.outputs.created }}
    env:
      VERSION: ${{ github.event.client_payload.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: check
        name: Create matching release
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$VERSION" -R rntgspr/cumaru >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists; nothing to do"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$VERSION" --target main --title "Cumaru $VERSION" \
            --notes "Wraps https://github.com/rntgspr/cumaru/releases/tag/$VERSION"
          echo "created=true" >> "$GITHUB_OUTPUT"

  # A release created with GITHUB_TOKEN does not fire release events, so publish is called here.
  publish:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
